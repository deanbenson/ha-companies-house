search_companies:
  fields:
    config_entry_id:
      selector: &id001
        config_entry:
          integration: companies_house
    query:
      selector: &id002
        text: {}
      required: true
      example: Example Trading
    items_per_page:
      selector: &id004
        number:
          min: 1
          max: 100
          mode: box
    start_index:
      selector: &id005
        number:
          min: 0
          max: 10000
          mode: box
advanced_search:
  fields:
    config_entry_id:
      selector: *id001
    company_name_includes:
      selector: *id002
    company_name_excludes:
      selector: *id002
    location:
      selector: *id002
    postcode:
      selector: *id002
    sic_codes:
      selector:
        text:
          multiple: true
    company_status:
      selector:
        select:
          multiple: true
          custom_value: true
          options:
          - active
          - dissolved
          - open
          - closed
          - converted-closed
          - receivership
          - administration
          - liquidation
          - insolvency-proceedings
          - voluntary-arrangement
          - registered
          - removed
    company_type:
      selector:
        text:
          multiple: true
    incorporated_from:
      selector: &id003
        date: {}
    incorporated_to:
      selector: *id003
    dissolved_from:
      selector: *id003
    dissolved_to:
      selector: *id003
    size:
      selector:
        number:
          min: 1
          max: 5000
          mode: box
alphabetical_search:
  fields:
    config_entry_id:
      selector: *id001
    query:
      selector: *id002
      required: true
      example: Pulse
    search_above:
      selector: *id002
    search_below:
      selector: *id002
    size:
      selector: *id004
dissolved_search:
  fields:
    config_entry_id:
      selector: *id001
    query:
      selector: *id002
      required: true
      example: Pulse
    search_type:
      selector:
        select:
          options:
          - alphabetical
          - best-match
          - previous-name-dissolved
    start_index:
      selector: *id005
    size:
      selector: *id004
